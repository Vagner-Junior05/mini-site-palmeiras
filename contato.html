
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmeiras - Contato</title>
</head>
<body style="background-color: white; color: #006437;">

    <header>
        <h1>Entre em Contato</h1>

        <nav>
            <a href="index.html" style="font-size: 20px; margin-right: 15px; color: #006437;">Home</a>
            <a href="sobre.html" style="font-size: 20px; margin-right: 15px; color: #006437;">Sobre</a>
            <a href="contato.html" style="font-size: 20px; color: #006437;">Contato</a>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Envie sua mensagem</h2>

            <p>Preencha o formulário abaixo para deixar sua mensagem sobre o Palmeiras.</p>

            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                    placeholder="email@example.com" required>

                <br><br>

                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto"
                    placeholder="Digite o assunto" required>

                <br><br>

                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="historia">História</option>
                    <option value="jogadores">Jogadores</option>
                    <option value="titulos">Títulos</option>
                    <option value="outros">Outros</option>
                </select>

                <br><br>

                <label for="comentario">Comentário:</label>
                <br>
                <textarea id="comentario" name="comentario"
                    rows="5" cols="40"
                    placeholder="Escreva seu comentário aqui..." required></textarea>

                <br><br>

                <button type="submit"
                    style="background-color: #006437; color: white;">
                    Enviar
                </button>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Vagner Junior. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
